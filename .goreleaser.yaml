version: 2

project_name: pcpt

before:
  hooks:
    - go mod tidy

builds:
  - id: pcpt
    main: ./
    binary: pcpt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/RobertoCCC/postcode-pt-cli/cmd.Version={{.Version}}
      - -X github.com/RobertoCCC/postcode-pt-cli/cmd.Commit={{.Commit}}
      - -X github.com/RobertoCCC/postcode-pt-cli/cmd.Date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: RobertoCCC
    name: postcode-pt-cli
  draft: false
  prerelease: auto
